name: Publish

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:

  donation-api:
    name: Deploy Donation Portal Image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build and publish Docker Image
        uses: openzim/docker-publish-action@v10
        with:
          image-name: kiwix/donation-portal
          on-master: latest
          restrict-to: kiwix/donation-portal
          registries: ghcr.io
          credentials:
            GHCRIO_USERNAME=${{ secrets.GHCR_USERNAME }}
            GHCRIO_TOKEN=${{ secrets.GHCR_TOKEN }}
